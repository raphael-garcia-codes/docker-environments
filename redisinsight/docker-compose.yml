version: "3.9"

services:

  redisinsight:
    image: redis/redisinsight:latest

    container_name: redisinsight

    hostname: redisinsight

    restart: unless-stopped

    ports:
      - "5540:5540"

    environment:
      TZ: America/Sao_Paulo

    volumes:
      # Persistência dos dados do Redis Insight
      - ./data:/data

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5540"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - backend

networks:
  backend:
    driver: bridge