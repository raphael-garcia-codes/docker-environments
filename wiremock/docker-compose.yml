version: "3.9"
services:
  wiremock:
    image: wiremock/wiremock:3.13.1
    container_name: wiremock
    hostname: wiremock
    restart: unless-stopped

    ports:
      - "18081:8080"
    command:
      - "--global-response-templating"
      - "--verbose"
      - "--disable-banner"

    environment:
      TZ: America/Sao_Paulo

    volumes:
      # Mapeamentos
      - ./wiremock/mappings:/home/wiremock/mappings
      # Arquivos de resposta
      - ./wiremock/__files:/home/wiremock/__files
      # Extensões
      - ./wiremock/extensions:/var/wiremock/extensions
      # Logs
      - ./wiremock/logs:/var/log/wiremock
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18081/__admin"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - backend
networks:
  backend:
    driver: bridge