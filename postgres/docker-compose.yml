version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-db

    restart: always

    hostname: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres_db
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo

    ports:
      - "5432:5432"

    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      # Scripts executados apenas na primeira inicialização
      #- ./init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d minha_aplicacao"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - backend

networks:
  backend:
    driver: bridge