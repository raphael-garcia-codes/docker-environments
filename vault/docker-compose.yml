version: "3.9"

services:

  vault:
    image: hashicorp/vault:1.20

    container_name: vault

    hostname: vault

    restart: unless-stopped

    cap_add:
      - IPC_LOCK

    ports:
      - "8200:8200"

    environment:
      TZ: America/Sao_Paulo
      VAULT_ADDR: http://0.0.0.0:8200

    command: vault server -config=/config/vault.hcl

    volumes:
      # Configuração
      - ./config:/config

      # Dados persistentes
      - ./file:/file

      # Logs
      - ./logs:/logs

    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - backend

networks:
  backend:
    driver: bridge