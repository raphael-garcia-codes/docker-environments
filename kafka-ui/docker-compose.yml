version: "3.9"

services:

  kafka-ui:
    image: provectuslabs/kafka-ui:latest

    container_name: kafka-ui

    hostname: kafka-ui

    restart: unless-stopped

    ports:
      - "18080:8080"

    environment:

      TZ: America/Sao_Paulo

      DYNAMIC_CONFIG_ENABLED: "true"

      KAFKA_CLUSTERS_0_NAME: Local

      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

    volumes:
      # Configurações persistentes
      - ./data:/etc/kafkaui

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:18080"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    networks:
      - backend

networks:
  backend:
    driver: bridge