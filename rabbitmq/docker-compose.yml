version: "3.9"

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq

    hostname: rabbitmq

    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq
      RABBITMQ_DEFAULT_PASS: rabbitmq
      RABBITMQ_DEFAULT_VHOST: /

      TZ: America/Sao_Paulo

    ports:
      # AMQP
      - "5672:5672"

      # Interface Web
      - "15672:15672"

    volumes:
      # Dados persistentes
      - ./rabbitmq/data:/var/lib/rabbitmq

      # Logs
      - ./rabbitmq/log:/var/log/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - backend

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

networks:
  backend:
    driver: bridge